<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WYSIWYG Editor{% endblock %} — SNES Web Emulator</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'snes/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'snes/css/ui_fluidity.css' %}">
    <link rel="stylesheet" href="{% static 'wysiwyg/css/editor.css' %}">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1><span class="logo"></span>WYSIWYG Editor</h1>
            <p class="sub">Rich-text page editor. Works on PythonAnywhere (Django + SQLite, no extra pip packages).</p>
        </header>

        <nav style="padding:10px 14px; border-bottom:1px solid var(--border); background:var(--panel);">
            <a href="{% url 'wysiwyg:list' %}" class="btn accent">← All pages</a>
            <a href="{% url 'admin:index' %}" class="btn" style="float:right">Admin</a>
        </nav>

        {% block content %}{% endblock %}
    </div>

    <script type="module" src="{% static 'wysiwyg/js/editor.js' %}"></script>
</body>
</html>
