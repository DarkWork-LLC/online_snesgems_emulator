{% extends 'wysiwyg/base.html' %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<article style="padding:14px; max-width:860px; margin:0 auto; line-height:1.7; color:var(--text);">
    <header style="border-bottom:2px solid var(--border); padding-bottom:10px; margin-bottom:18px;">
        <h1 style="margin:0 0 6px 0; font-size:28px;">{{ page.title }}</h1>
        <div class="rom-meta" style="color:var(--muted); font-size:13px;">
            Slug: <code>{{ page.slug }}</code> &middot;
            Updated: {{ page.updated_at|date:"M d, Y H:i" }} UTC
        </div>
    </header>
    <div class="page-content" style="white-space:pre-wrap; font-size:16px;">
        {{ page.content|safe }}
    </div>
    <footer style="margin-top:26px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:13px; display:flex; justify-content:space-between;">
        <a href="{% url 'wysiwyg:edit' page.slug %}" class="btn">✎ Edit</a>
        <a href="{% url 'wysiwyg:list' %}" class="btn">← Back to list</a>
    </footer>
</article>
{% endblock %}
